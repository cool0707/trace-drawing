<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>図面トレース</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="bar">
  <div class="grp">
    <button id="btn-open" class="primary">画像を開く</button>
    <input id="file" type="file" accept="image/*,.tif,.tiff" hidden>
    <button id="btn-load" title="保存した作業ファイル (.json) を読み込む">作業を開く</button>
    <input id="file-doc" type="file" accept=".json" hidden>
    <button id="btn-save" title="手修正の途中経過を保存">作業を保存</button>
  </div>
  <div class="grp tools" id="tools">
    <button data-tool="select" class="on" title="選択 (V)">選択</button>
    <button data-tool="line" title="線を引く (L) — Shift で水平垂直">線</button>
    <button data-tool="circle" title="円 (C) — 中心 → 半径">円</button>
    <button data-tool="text" title="文字を置く (T)">文字</button>
    <button data-tool="split" title="線を分割 (X) — クリック位置で切る">分割</button>
    <button data-tool="corners" title="図面の 4 隅を順にクリックして歪みを手動補正">4点補正</button>
  </div>
  <div class="grp">
    <button id="btn-undo" title="元に戻す (Ctrl+Z)">↶</button>
    <button id="btn-redo" title="やり直す (Ctrl+Y)">↷</button>
    <button id="btn-fit" title="全体表示 (F)">全体</button>
  </div>
  <div class="grp right">
    <button id="btn-svg">SVG 出力</button>
    <button id="btn-dxf">DXF 出力</button>
  </div>
</header>

<main>
  <aside id="side">
    <section>
      <h2>表示</h2>
      <label class="chk"><input type="checkbox" id="ly-line" checked><i class="sw c-line"></i>線</label>
      <label class="chk"><input type="checkbox" id="ly-hatch" checked><i class="sw c-hatch"></i>ハッチング</label>
      <label class="chk"><input type="checkbox" id="ly-text" checked><i class="sw c-text"></i>文字</label>
      <label class="chk"><input type="checkbox" id="ly-fill" checked><i class="sw c-fill"></i>塗り</label>
      <label class="chk"><input type="checkbox" id="ly-ends" checked>端点を表示</label>
      <label class="row">下絵
        <select id="bg-kind"><option value="0">補正済み画像</option><option value="1">二値画像</option><option value="-1">なし</option></select>
      </label>
      <label class="row">下絵の濃さ <input type="range" id="bg-alpha" min="0" max="100" value="45"></label>
    </section>

    <section>
      <h2>選択中の操作</h2>
      <div class="btns">
        <button id="op-join" title="同一直線上の線を 1 本に / 2 本なら交点で角を作る (J)">接続 <kbd>J</kbd></button>
        <button id="op-del" title="削除 (Delete)">削除 <kbd>Del</kbd></button>
        <button id="op-solid" title="実線 (1)">実線 <kbd>1</kbd></button>
        <button id="op-dash" title="破線 (2)">破線 <kbd>2</kbd></button>
        <button id="op-chain" title="一点鎖線 (3)">鎖線 <kbd>3</kbd></button>
        <button id="op-hatch" title="ハッチング扱いにする (H)">ハッチに <kbd>H</kbd></button>
        <button id="op-line" title="通常の線に戻す (N)">線に戻す <kbd>N</kbd></button>
        <button id="op-text" title="選択した線を文字ブロックにまとめる (G)">文字に <kbd>G</kbd></button>
        <button id="op-untext" title="文字ブロックを線に戻す (U)">文字解除 <kbd>U</kbd></button>
      </div>
      <p class="hint" id="sel-info">何も選択されていません</p>
    </section>

    <section>
      <h2>トレース設定</h2>
      <label class="row">線の拾いやすさ <input type="range" id="p-sensitivity" min="0" max="100" value="50"></label>
      <label class="row">歪み補正
        <select id="p-rectify">
          <option value="perspective">自動 (傾き+台形)</option>
          <option value="affine">傾き+せん断</option>
          <option value="rotate">傾きのみ</option>
          <option value="none">しない</option>
        </select>
      </label>
      <label class="row">向き
        <span><button id="rot-l" title="左に 90°">⟲</button><button id="rot-r" title="右に 90°">⟳</button></span>
      </label>
      <label class="row">白黒反転
        <select id="p-invert"><option value="-1">自動</option><option value="0">しない</option><option value="1">する</option></select>
      </label>
      <label class="row">作業解像度 (長辺 px) <input type="number" id="p-max_side" min="0" step="500" value="5000"></label>
      <label class="row">ゴミ除去の強さ <input type="number" id="p-despeckle" min="0" step="0.5" value="2"></label>
      <label class="row">最短の線 (線幅×) <input type="number" id="p-min_len" min="0" step="0.5" value="3"></label>
      <label class="row">水平垂直にそろえる角度 [°] <input type="number" id="p-snap_hv_deg" min="0" step="0.5" value="1.5"></label>
      <label class="chk"><input type="checkbox" id="p-arcs" checked>円・円弧を検出</label>

      <label class="chk"><input type="checkbox" id="p-dashed" checked>破線・鎖線を 1 本にまとめる</label>
      <label class="row sub">最大すき間 (線幅×) <input type="number" id="p-dash_max_gap" min="1" step="1" value="14"></label>

      <label class="chk"><input type="checkbox" id="p-hatch" checked>ハッチングを分離</label>
      <label class="row sub">最大間隔 (線幅×) <input type="number" id="p-hatch_max_spacing" min="1" step="1" value="14"></label>
      <label class="row sub">最少本数 <input type="number" id="p-hatch_min_lines" min="2" step="1" value="4"></label>
      <label class="chk sub"><input type="checkbox" id="p-hatch_axis">水平・垂直の束も対象</label>

      <label class="chk"><input type="checkbox" id="p-text" checked>文字を分離</label>
      <label class="row sub">文字の最大サイズ (線幅×) <input type="number" id="p-text_max_size" min="1" step="1" value="30"></label>

      <label class="chk"><input type="checkbox" id="p-fill" checked>ベタ塗りを輪郭化</label>
      <label class="row sub">最小の太さ (線幅×) <input type="number" id="p-fill_min_width" min="1" step="0.5" value="5"></label>

      <div class="btns">
        <button id="btn-retrace" class="primary">この設定で再トレース</button>
        <button id="btn-auto-rect" title="4点補正を取り消して自動補正に戻す" hidden>4点補正を解除</button>
      </div>
      <p class="hint">再トレースすると手修正は失われます。</p>
    </section>

    <section>
      <h2>出力</h2>
      <label class="chk"><input type="checkbox" id="ex-hatch">ハッチングも出力</label>
      <label class="chk"><input type="checkbox" id="ex-text" checked>文字を出力</label>
      <label class="chk"><input type="checkbox" id="ex-fill" checked>塗りを出力</label>
      <label class="row">スキャン解像度 [dpi] <input type="number" id="ex-dpi" min="0" step="50" value="0" title="0 なら画素単位で出力"></label>
      <label class="row">縮尺 1 / <input type="number" id="ex-denom" min="1" step="1" value="1"></label>
      <p class="hint">dpi を入れると mm 単位、縮尺も入れると実寸で出力します。</p>
    </section>
  </aside>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="drop">
      <div>
        <p class="big">図面の画像をここにドロップ</p>
        <p>または「画像を開く」— PNG / JPEG / TIFF / BMP</p>
        <p class="small">画像はこの PC の中だけで処理され、どこにも送信されません。</p>
      </div>
    </div>
    <div id="busy" hidden><div class="spin"></div><span>処理中…</span></div>
  </div>
</main>

<footer id="status"><span id="st-msg">画像を開いてください</span><span id="st-pos"></span></footer>
<script type="module" src="app.js"></script>
</body>
</html>
