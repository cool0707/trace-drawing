[package]
name = "trace-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "図面トレースのデスクトップ版 (Windows / WebView2)"

[[bin]]
name = "trace-drawing-app"
path = "src/main.rs"

# WebView2 を使うのは Windows だけ。他の OS では案内を表示するだけの小さなバイナリになる。
[target.'cfg(windows)'.dependencies]
wry = "0.53"
tao = "0.34"
rfd = "0.15"
base64 = "0.22"
serde_json = "1"

# exe にアイコン (icon.ico = web/icon.svg を書き出したもの) を埋め込む
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
